name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run Django Tests
      env:
        SECRET_KEY: test-key-123
        DEBUG: True
        DATABASE_URL: sqlite:///db.sqlite3
      run: |
        cd backend
        python manage.py test

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Downcase repository name
      run: |
        echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
    - name: Build and Push App Image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: |
          ghcr.io/${{ env.IMAGE_NAME }}/app:latest
          ghcr.io/${{ env.IMAGE_NAME }}/app:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
    - name: Downcase repository name
      run: |
        echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
    - name: Deploy to VPS
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          cd /app/sampaio-ai
          git pull origin main
          docker pull ghcr.io/${{ env.IMAGE_NAME }}/app:latest
          docker stack deploy --with-registry-auth -c stack.yml sampaioai

  deploy-hf:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        lfs: true
    - name: Fetch all Git LFS history
      run: git lfs fetch --all
    - name: Push to Hugging Face Spaces
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        HF_SPACE_NAME="${{ secrets.HF_SPACE }}"
        if [ -z "$HF_SPACE_NAME" ]; then
          HF_SPACE_NAME="SUPERCAI0/sampaio-ai"
        fi
        echo "Deploying to Hugging Face Space: $HF_SPACE_NAME"
        git push --force https://anything:$HF_TOKEN@huggingface.co/spaces/$HF_SPACE_NAME main
