version: '3.8'

services:
  db:
    image: postgres:18-alpine
    container_name: sampaio_ai_db
    environment:
      POSTGRES_DB: sampaio_ai_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sampaio_net

  redis:
    image: redis:7-alpine
    container_name: sampaio_ai_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - sampaio_net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: sampaio_ai_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - sampaio_net

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sampaio_ai_app
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-sampaio-ai-development-key
      - DATABASE_URL=postgres://postgres:postgrespassword@db:5432/sampaio_ai_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - db
      - redis
      - rabbitmq
    networks:
      - sampaio_net

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sampaio_ai_celery_worker
    command: celery -A core worker --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-sampaio-ai-development-key
      - DATABASE_URL=postgres://postgres:postgrespassword@db:5432/sampaio_ai_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
      - rabbitmq
      - db
    networks:
      - sampaio_net

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sampaio_ai_celery_beat
    command: celery -A core beat --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-sampaio-ai-development-key
      - DATABASE_URL=postgres://postgres:postgrespassword@db:5432/sampaio_ai_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
      - rabbitmq
      - db
    networks:
      - sampaio_net

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  sampaio_net:
    driver: bridge
