version: '3.8'

services:
  db:
    image: postgres:18-alpine
    container_name: sampaio_ai_db
    environment:
      POSTGRES_DB: sampaio_ai_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - sampaio_net

  redis:
    image: redis:7-alpine
    container_name: sampaio_ai_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - sampaio_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sampaio_ai_app
    command: sh entrypoint.sh
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-sampaio-ai-development-key
      - DATABASE_URL=postgres://postgres:postgrespassword@db:5432/sampaio_ai_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - db
      - redis
    networks:
      - sampaio_net

volumes:
  postgres_data:
  redis_data:

networks:
  sampaio_net:
    driver: bridge
